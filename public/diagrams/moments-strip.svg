<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="The moments of a scene, in order"><title>The moments of a scene, in order</title><rect width="720" height="200" rx="14" fill="#f7f5fb" stroke="#d9d3ea"/><text x="24" y="32" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#2b2540" text-anchor="start" font-weight="700">A scene is a series of moments, like slides</text><rect x="24" y="56" width="108" height="84" rx="10" fill="#fff" stroke="#6c5ce7" stroke-width="2"/><rect x="24" y="56" width="108" height="22" rx="10" fill="#6c5ce7"/><text x="34" y="72" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="700">Dialogue</text><text x="34" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="start" font-weight="400">Moment 1</text><text x="34" y="124" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="start" font-weight="400">players see it</text><rect x="138" y="56" width="108" height="84" rx="10" fill="#fff" stroke="#6c5ce7" stroke-width="2"/><rect x="138" y="56" width="108" height="22" rx="10" fill="#6c5ce7"/><text x="148" y="72" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="700">Dialogue</text><text x="148" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="start" font-weight="400">Moment 2</text><text x="148" y="124" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="start" font-weight="400">players see it</text><rect x="252" y="56" width="108" height="84" rx="10" fill="#fff" stroke="#e17055" stroke-width="2"/><rect x="252" y="56" width="108" height="22" rx="10" fill="#e17055"/><text x="262" y="72" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="700">Choice</text><text x="262" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="start" font-weight="400">Moment 3</text><text x="262" y="124" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="start" font-weight="400">players see it</text><rect x="366" y="56" width="108" height="84" rx="10" fill="#fff" stroke="#00a3a3" stroke-width="2"/><rect x="366" y="56" width="108" height="22" rx="10" fill="#00a3a3"/><text x="376" y="72" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="700">If…</text><text x="376" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="start" font-weight="400">Moment 4</text><text x="376" y="124" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="start" font-weight="400">hidden</text><rect x="480" y="56" width="108" height="84" rx="10" fill="#fff" stroke="#b2788a" stroke-width="2"/><rect x="480" y="56" width="108" height="22" rx="10" fill="#b2788a"/><text x="490" y="72" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="700">Jump</text><text x="490" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="start" font-weight="400">Moment 5</text><text x="490" y="124" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="start" font-weight="400">hidden</text><rect x="594" y="56" width="108" height="84" rx="10" fill="#fff" stroke="#2d3436" stroke-width="2"/><rect x="594" y="56" width="108" height="22" rx="10" fill="#2d3436"/><text x="604" y="72" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="700">Ending</text><text x="604" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="start" font-weight="400">Moment 6</text><text x="604" y="124" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="start" font-weight="400">players see it</text><text x="24" y="172" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="400">Choice, If… and Jump can send the story to another scene. If… and Jump are invisible to players.</text></svg>