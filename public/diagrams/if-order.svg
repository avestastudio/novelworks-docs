<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="An If… checks its cases from top to bottom"><title>An If… checks its cases from top to bottom</title><rect width="720" height="300" rx="14" fill="#f7f5fb" stroke="#d9d3ea"/><text x="24" y="32" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#2b2540" text-anchor="start" font-weight="700">The first case that holds wins</text><rect x="24" y="56" width="672" height="52" rx="10" fill="#fff" stroke="#00a3a3" stroke-width="2"/><text x="40" y="87" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#00a3a3" text-anchor="start" font-weight="700">Case 1</text><text x="130" y="87" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="400">Affection is at least 3 and Met Mia is Yes</text><text x="520" y="87" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="600">→ Scene “Good end”</text><text x="360" y="126" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="middle" font-weight="400">↓ not true? check the next case</text><rect x="24" y="128" width="672" height="52" rx="10" fill="#fff" stroke="#6c5ce7" stroke-width="2"/><text x="40" y="159" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#6c5ce7" text-anchor="start" font-weight="700">Case 2</text><text x="130" y="159" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="400">Affection is at least 1</text><text x="520" y="159" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="600">→ Scene “Friends”</text><text x="360" y="198" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="middle" font-weight="400">↓ not true? check the next case</text><rect x="24" y="200" width="672" height="52" rx="10" fill="#fff" stroke="#e17055" stroke-width="2"/><text x="40" y="231" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#e17055" text-anchor="start" font-weight="700">otherwise</text><text x="130" y="231" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="400">nothing above held</text><text x="520" y="231" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="600">→ Scene “Alone”</text><text x="24" y="276" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b6385" text-anchor="start" font-weight="400">If no scene is chosen for “otherwise”, the story continues with the next moment.</text></svg>