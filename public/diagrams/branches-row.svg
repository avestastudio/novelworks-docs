ze="13" fill="#2b2540" text-anchor="start" font-weight="600">Background</text><rect x="156" y="100" width="528" height="26" rx="13" fill="#6c5ce7"/><text x="170" y="118" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="600">Classroom</text><text x="24" y="158" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="600">Mia</text><rect x="336" y="140" width="348" height="26" rx="13" fill="#e17055"/><text x="350" y="158" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="600">Mia</text><line x1="24" y1="182" x2="696" y2="182" stroke="#d9d3ea"/><text x="24" y="210" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="700">Branches</text><rect x="336" y="190" width="82" height="28" rx="8" fill="#fff" stroke="#e17055" stroke-width="2"/><text x="342" y="209" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2b2540" text-anchor="start" font-weight="600">⑂ Library +1</text><rect x="606" y="190" width="78" height="28" rx="8" fill="#fff" stroke="#2d3436" stroke-width="2"/><text x="614" y="209" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2b2540" text-anchor="start" font-weight="600">⚑ The End</text><text x="24" y="260" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="400">A mark appears only on a moment that leaves the scene.</text><text x="24" y="282" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b6385" text-anchor="start" font-weight="400">Fork: choice or If…  ·  Arrow: jump  ·  Flag: ending  ·  “+1”: one more exit.</text></svg>