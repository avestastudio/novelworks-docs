<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Characters stay on stage from one moment to the next"><title>Characters stay on stage from one moment to the next</title><rect width="720" height="330" rx="14" fill="#f7f5fb" stroke="#d9d3ea"/><text x="24" y="34" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#2b2540" text-anchor="start" font-weight="700">A scene of 6 moments. The chart shows what stays on stage.</text><rect x="156" y="56" width="78" height="64" rx="8" fill="#fff" stroke="#c9c1e0"/><text x="195.0" y="84" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="middle" font-weight="400">Moment 1</text><text x="195.0" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="middle" font-weight="400">line</text><rect x="246" y="56" width="78" height="64" rx="8" fill="#fff" stroke="#c9c1e0"/><text x="285.0" y="84" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="middle" font-weight="400">Moment 2</text><text x="285.0" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="middle" font-weight="400">line</text><rect x="336" y="56" width="78" height="64" rx="8" fill="#fff" stroke="#c9c1e0"/><text x="375.0" y="84" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="middle" font-weight="400">Moment 3</text><text x="375.0" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="middle" font-weight="400">line</text><rect x="426" y="56" width="78" height="64" rx="8" fill="#fff" stroke="#c9c1e0"/><text x="465.0" y="84" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="middle" font-weight="400">Moment 4</text><text x="465.0" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="middle" font-weight="400">line</text><rect x="516" y="56" width="78" height="64" rx="8" fill="#fff" stroke="#c9c1e0"/><text x="555.0" y="84" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="middle" font-weight="400">Moment 5</text><text x="555.0" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="middle" font-weight="400">line</text><rect x="606" y="56" width="78" height="64" rx="8" fill="#fff" stroke="#c9c1e0"/><text x="645.0" y="84" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b6385" text-anchor="middle" font-weight="400">Moment 6</text><text x="645.0" y="104" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#9a93b0" text-anchor="middle" font-weight="400">line</text><text x="24" y="152" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="600">Background</text><rect x="156" y="136" width="528" height="26" rx="13" fill="#6c5ce7"/><text x="170" y="154" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="600">Classroom</text><text x="24" y="192" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="600">Leo</text><rect x="246" y="176" width="168" height="26" rx="13" fill="#00a3a3"/><text x="260" y="194" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="600">Leo</text><text x="24" y="232" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="600">Mia</text><rect x="426" y="216" width="258" height="26" rx="13" fill="#e17055"/><text x="440" y="234" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="600">Mia arrives at 4, stays</text><line x1="420" y1="126" x2="420" y2="250" stroke="#e17055" stroke-dasharray="4 4"/><text x="24" y="290" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#2b2540" text-anchor="start" font-weight="400">Mia stays on stage until the end of the scene. Leo leaves after moment 3.</text><text x="24" y="312" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b6385" text-anchor="start" font-weight="400">The lines of dialogue are never carried over: only the background and the characters are.</text></svg>